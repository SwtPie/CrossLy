<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossLy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">CrossLy</div>
      <nav id="nav" class="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-footer" id="app-version"></div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1 id="screen-title"></h1>
        <div id="event-badge" class="event-badge" hidden></div>
      </header>
      <section id="screen" class="screen" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Classic scripts on purpose: a single global namespace (window.CrossLy),
       no module loader, so the app also works when opened from file:// -->
  <script src="js/strings.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens/events.js"></script>
  <script src="js/screens/placeholders.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
